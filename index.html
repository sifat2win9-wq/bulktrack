<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>BULKTRACK</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&display=swap"><style>
:root{--sage:#AEB5AD;--bk:#080A09;--card:#171A18;--c2:#292E2B;--lime:#B8F500;--mut:#A4AAA5;--bd:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bk);color:#fff;font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 4vw;gap:12px}
.logo{font-weight:800;letter-spacing:.08em;display:flex;gap:8px;align-items:center;color:#0b0d0c}
.logo i{width:22px;height:22px;border-radius:7px;background:#0b0d0c;display:grid;place-items:center;color:var(--lime);font-style:normal;font-size:13px}
.links{display:flex;gap:4px;background:rgba(255,255,255,.3);border-radius:99px;padding:4px}
.links a{padding:8px 16px;border-radius:99px;font-size:14px;color:#0b0d0c}.links a.on{background:#0b0d0c;color:#fff}
.ic{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.14);display:grid;place-items:center;color:#0b0d0c;cursor:pointer;border:0}
.hero{background:radial-gradient(circle at 50% 30%,#c4cac3,#AEB5AD 60%,#9ba39a);color:#0b0d0c;padding-bottom:36px}
.hg{display:grid;grid-template-columns:1.05fr .9fr 1.05fr;gap:20px;padding:10px 4vw 0;align-items:start}
h1{font-weight:300;font-size:clamp(40px,5.6vw,80px);line-height:.98;margin:12px 0 14px;letter-spacing:-.02em}
.pill{display:inline-block;border:1px solid rgba(0,0,0,.35);border-radius:99px;padding:5px 14px;font-size:12px;letter-spacing:.08em}
.big{font-size:48px;font-weight:300}.big small{font-size:16px;margin-left:6px}
.g,.gd{border-radius:28px;padding:20px;backdrop-filter:blur(14px)}.g{background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.4)}.gd{background:rgba(22,26,24,.72);color:#fff;border:1px solid var(--bd)}
.g h4,.gd h4{margin:0 0 12px;font-weight:400;font-size:17px}.lab{font-size:11px;letter-spacing:.1em;opacity:.65}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between}.stack{display:grid;gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.art{min-height:340px;display:grid;place-items:center}
.bar{height:6px;border-radius:9px;background:rgba(128,128,128,.3);overflow:hidden}.bar b{display:block;height:100%;background:var(--lime);border-radius:9px;transition:width .6s}
.hero .bar b{background:#0b0d0c}.gd .bar b{background:var(--lime)}
.ctl{padding:22px 4vw 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f{border:1px solid var(--bd);background:#0f1211;border-radius:99px;padding:10px 20px;cursor:pointer;font-size:14px}.f.on{background:#fff;color:#000}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px 4vw 48px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:32px;padding:26px;min-height:300px;display:flex;flex-direction:column;gap:14px}
.c h3{margin:0;font-weight:500;font-size:18px}.lim{color:var(--lime)}.mut{color:var(--mut);font-size:13px}
.btn{background:var(--lime);color:#000;border:0;border-radius:99px;padding:11px 20px;font-weight:700;cursor:pointer}.btn.o{background:transparent;color:#fff;border:1px solid var(--bd)}
input,select{background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;width:100%;min-width:0}
.page{padding:28px 4vw 60px;max-width:1200px;margin:0 auto}.page h2{font-weight:300;font-size:clamp(30px,4vw,52px);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.chip{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--c2);cursor:pointer;border:0;font-size:13px}.chip.on{background:var(--lime);color:#000}
.pg nav{background:#0f1211}.pg .logo,.pg .links a,.pg .ic{color:#fff}.pg .links{background:var(--c2)}.pg .links a.on{background:var(--lime);color:#000}.pg .logo i{background:var(--lime);color:#000}.pg .ic{background:var(--c2)}
.demo{font-size:11px;background:var(--lime);color:#000;border-radius:99px;padding:3px 10px;font-weight:700}
@media(max-width:980px){.hg{grid-template-columns:1fr}.art{min-height:240px;order:-1}.cards{grid-template-columns:1fr}.links{order:3;width:100%;overflow:auto}nav{flex-wrap:wrap}}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.tab{display:none}.c,.g,.gd{transition:transform .25s,box-shadow .25s}.c:hover,.g:hover,.gd:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.28)}
@keyframes fl{50%{transform:translateY(-10px)}}.art svg{animation:fl 6s ease-in-out infinite}@keyframes inn{from{opacity:0;transform:translateY(12px)}}.page,.cards,.hg{animation:inn .5s both}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:22px}.stat b{display:block;font-size:34px;font-weight:300;color:var(--lime);margin-top:6px}
@media(max-width:980px){.tab{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(23,26,24,.94);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:99px;padding:6px;z-index:9;justify-content:space-around}.tab a{padding:10px 11px;border-radius:99px;font-size:12px;color:var(--mut)}.tab a.on{background:var(--lime);color:#000;font-weight:700}.links{display:none}body{padding-bottom:90px}}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#080A09"></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)},T=dk(0);
const M=[{n:'Breakfast',d:'4 eggs · banana · 100 g atta pancakes · 1 tbsp honey',k:820,p:37,c:116,f:23},{n:'Lunch',d:'115 g chicken · 300 g rice · 70 g potato · curry',k:785,p:52,c:102,f:15},{n:'Dinner',d:'115 g chicken · 200 g rice · 70 g potato · curry',k:655,p:50,c:74,f:15},{n:'Shake',d:'250 ml milk · banana · 40 g peanuts · 30 g oats',k:600,p:23,c:65,f:30}];
const SPL=['Rest','Chest','Back','Shoulders','Arms','Legs','Rest'],EX={Chest:['Bench Press','Incline DB Press','Cable Fly','Dips'],Back:['Pull-ups','Barbell Row','Lat Pulldown','Seated Row'],Shoulders:['Overhead Press','Lateral Raise','Rear Delt Fly','Shrugs'],Arms:['Barbell Curl','Hammer Curl','Skull Crusher','Pushdown'],Legs:['Squat','Leg Press','Romanian Deadlift','Calf Raise']};
const WK=[60.4,60.5,60.5,60.7,60.6,60.8,60.7,60.9,61,60.9,61.1,61,61.2,61];
let S=null;try{S=JSON.parse(localStorage.getItem('bt'))}catch(e){}
if(!S)S={demo:1,set:{cal:2800,pro:125,start:61,goal:65},log:[{d:T,...M[0],n:'Breakfast'},{d:T,...M[1],n:'Lunch'},{d:T,n:'Shake',k:600,p:23,c:65,f:30}],w:WK.map((w,i)=>({d:dk(13-i),w})),done:{[dk(1)]:1,[dk(2)]:1,[dk(3)]:1,[dk(4)]:1},sets:{},rec:{},saved:[]};
const save=()=>{try{localStorage.setItem('bt',JSON.stringify(S))}catch(e){}};
let F='all',V=(location.hash||'#dash').slice(1);
const tl=()=>S.log.filter(x=>x.d==T),sum=k=>tl().reduce((a,x)=>a+x[k],0),cw=()=>S.w[S.w.length-1]?.w||S.set.start;
const avg7=()=>{const a=S.w.slice(-7);return a.reduce((s,x)=>s+x.w,0)/a.length};
const mon=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)};
const wdone=()=>Object.keys(S.done).filter(d=>d>=mon()).length,grp=SPL[new Date().getDay()];
function ring(p,sz,lb){const C=276.5;return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="8"/><circle cx="50" cy="50" r="44" fill="none" stroke="#B8F500" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*Math.min(p,1)} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="55" text-anchor="middle" fill="currentColor" font-size="17" font-weight="300">${lb}</text></svg>`}
function line(v,w,h,col){if(v.length<2)return'';const mn=Math.min(...v)-.2,mx=Math.max(...v)+.2,pts=v.map((y,i)=>`${i*w/(v.length-1)},${h-(y-mn)/(mx-mn)*h}`);return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="4" fill="${col}"/></svg>`}
const bar=(a,b)=>`<div class="bar"><b style="width:${Math.min(100,a/b*100)}%"></b></div>`;
function nav(){const L=[['nutrition','Nutrition'],['workouts','Workouts'],['progress','Progress'],['recovery','Recovery'],['report','Report']];return `<nav><a href="#dash" class="logo"><i>▲</i>BULKTRACK</a><div class="links">${L.map(l=>`<a href="#${l[0]}" class="${V==l[0]?'on':''}">${l[1]}</a>`).join('')}</div><div style="display:flex;gap:8px"><a class="ic" href="#settings" title="Settings">⚙</a></div></nav>`}
function figure(){return `<svg viewBox="0 0 300 340" width="100%" style="max-width:340px"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a302c"/><stop offset="1" stop-color="#0b0d0c"/></linearGradient></defs><circle cx="150" cy="170" r="140" fill="none" stroke="rgba(0,0,0,.18)" stroke-dasharray="3 7"/><circle cx="150" cy="170" r="140" fill="none" stroke="#B8F500" stroke-width="7" stroke-linecap="round" stroke-dasharray="${880*Math.max(.05,(cw()-S.set.start)/(S.set.goal-S.set.start))} 880" transform="rotate(-90 150 170)"/><rect x="40" y="250" width="220" height="14" rx="7" fill="rgba(0,0,0,.25)"/><circle cx="150" cy="82" r="26" fill="url(#gg)"/><path d="M92 130 Q150 112 208 130 L196 200 Q150 232 104 200Z" fill="url(#gg)"/><path d="M92 130 Q62 160 78 214 L98 208 Q92 170 108 148Z M208 130 Q238 160 222 214 L202 208 Q208 170 192 148Z" fill="#171A18"/><path d="M112 208 Q150 232 188 208 L184 262 L158 262 L150 226 L142 262 L116 262Z" fill="url(#gg)"/><circle cx="150" cy="170" r="6" fill="#B8F500"/></svg>`}
function dash(){const k=sum('k'),p=sum('p'),s=S.set,w7=S.w.slice(-7).map(x=>x.w);
const vis=x=>F=='all'||F==x?'':'style="display:none"';
return `<div class="hero">${nav()}<div class="hg"><div><span class="pill">YOUR MUSCLE GROWTH JOURNEY</span><h1>BUILD YOUR<br>STRONGER SELF.</h1><div class="mut" style="color:#2b302d;max-width:340px">From ${s.start} kg to ${s.goal} kg. Every workout, every meal, every step counts.</div><div class="big">${cw().toFixed(1)}<small>KG</small></div><div class="lab">TARGET: ${s.goal} KG</div><div style="margin-top:8px;max-width:260px">${bar(cw()-s.start,s.goal-s.start)}</div></div>
<div class="art">${figure()}</div>
<div class="stack"><div class="gd"><div class="row"><h4>Daily nutrition</h4><span class="lab">${s.cal-k>0?'REMAINING':'OVER'}</span></div><div class="row"><div><div class="big" style="font-size:36px">${k.toLocaleString()}<small>kcal</small></div><div class="mut">Target ${s.cal.toLocaleString()} · ${Math.abs(s.cal-k)} ${s.cal-k>0?'left':'over'}</div></div>${ring(k/s.cal,86,Math.round(k/s.cal*100)+'%')}</div></div>
<div class="two"><div class="g"><h4>Macros</h4><div style="font-size:13px;line-height:1.7">Protein <b>${p} / ${s.pro} g</b><br>Carbs <b>${sum('c')} g</b><br>Fat <b>${sum('f')} g</b></div></div><div class="g"><h4>Workouts</h4><div class="big" style="font-size:30px">${wdone()} / 5</div><div class="lab">NEXT: ${grp=='Rest'?'LEGS':grp.toUpperCase()}</div><div style="margin-top:8px">${bar(wdone(),5)}</div></div></div>
<div class="g"><div class="row"><h4>Weight progress</h4><span class="lab">7-DAY AVG ${avg7().toFixed(1)} KG</span></div>${line(w7,200,50,'#0b0d0c')}</div></div></div></div>
<div class="ctl">${[['all','Today'],['n','Nutrition'],['w','Workout'],['b','Weight progress']].map(f=>`<button class="f ${F==f[0]?'on':''}" onclick="F='${f[0]}';R()">${f[1]}</button>`).join('')}<span style="flex:1"></span>${S.demo?'<span class="demo">DEMO DATA</span>':''}</div>
<div class="cards"><div class="c" ${vis('n')}><h3>TODAY’S NUTRITION</h3><div class="row">${ring(k/s.cal,120,k)}<div class="mut">Remaining<br><b style="font-size:26px;color:#fff;font-weight:300">${Math.max(0,s.cal-k)}</b> kcal</div></div><div class="mut">Protein ${p}/${s.pro} g ${bar(p,s.pro)}</div><div class="mut">Carbs ${sum('c')} g · Fat ${sum('f')} g</div><button class="btn" onclick="go('nutrition')">+ Add food</button></div>
<div class="c" ${vis('w')}><h3>WORKOUT TRACKER</h3><div style="font-size:34px;font-weight:300">${grp}</div><div class="mut">${grp=='Rest'?'Rest day. Recover and eat.':EX[grp].length+' exercises · '+Object.values(S.sets[T]||{}).reduce((a,e)=>a+(e.s||[]).filter(Boolean).length,0)+'/'+EX[grp].length*3+' sets done'}</div><div class="mut">Week: ${wdone()} / 5 complete</div>${bar(wdone(),5)}<button class="btn" style="margin-top:auto" onclick="go('workouts')">Start workout</button></div>
<div class="c" ${vis('b')}><h3>BODY WEIGHT</h3><div class="row"><div style="font-size:38px;font-weight:300">${cw().toFixed(1)} <small class="mut">/ ${s.goal} kg</small></div><span class="lim">+${(cw()-s.start).toFixed(1)} kg</span></div>${line(w7,200,60,'#B8F500')}<div class="row"><input id="lw" type="number" step=".1" placeholder="Today’s weight"><button class="btn" onclick="logW('lw')">Log</button></div></div></div>`}
function nut(){const k=sum('k'),s=S.set;return `<div class="page"><h2>Nutrition</h2><div class="grid" style="margin-bottom:24px"><div class="c" style="min-height:0"><h3>Today</h3><div style="font-size:34px;font-weight:300">${k} <small class="mut">/ ${s.cal} kcal</small></div>${bar(k,s.cal)}<div class="mut">P ${sum('p')}/${s.pro} g · C ${sum('c')} g · F ${sum('f')} g</div></div></div>
<h3>Meal library</h3><div class="grid">${M.concat(S.saved).map((m,i)=>`<div class="c" style="min-height:0"><h3>${esc(m.n)}</h3><div class="mut">${esc(m.d||'Saved meal')}</div><div class="lim">${m.k} kcal · ${m.p}P ${m.c}C ${m.f}F</div><div class="row"><select id="sv${i}"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select><button class="btn" onclick="logM(${i})">Log</button></div></div>`).join('')}</div>
<h3 style="margin-top:28px">Custom food</h3><div class="grid"><input id="fn" placeholder="Name"><input id="fk" type="number" placeholder="kcal"><input id="fp" type="number" placeholder="Protein g"><input id="fc" type="number" placeholder="Carbs g"><input id="ff" type="number" placeholder="Fat g"><label class="mut"><input id="fs" type="checkbox" style="width:auto"> Save to library</label><button class="btn" onclick="addF()">Add food</button></div>
<h3 style="margin-top:28px">Today’s log</h3>${tl().map(x=>`<div class="row c" style="min-height:0;padding:14px 20px;margin-bottom:8px;flex-direction:row"><span>${esc(x.n)}</span><span class="lim">${x.k} kcal · ${x.p}P</span><button class="chip" onclick="del(${S.log.indexOf(x)})">✕</button></div>`).join('')||'<div class="mut">Nothing logged yet.</div>'}<div class="mut" style="margin-top:12px">Macro values are rough estimates.</div></div>`}
function wk(){const ex=EX[grp];if(!ex)return `<div class="page"><h2>Rest day</h2><div class="mut">Mon Chest · Tue Back · Wed Shoulders · Thu Arms · Fri Legs · Sat/Sun rest.</div></div>`;const t=S.sets[T]=S.sets[T]||{};return `<div class="page"><h2>${grp} day</h2><div class="grid">${ex.map((e,i)=>{const o=t[e]||{s:[0,0,0],w:'',r:''};return `<div class="c" style="min-height:0"><h3>${e}</h3><div>${o.s.map((d,j)=>`<button class="chip ${d?'on':''}" onclick="st('${e}',${j})">${j+1}</button> `).join('')}</div><div class="row"><input type="number" placeholder="kg" value="${o.w}" onchange="sw('${e}',this.value)"></div></div>`}).join('')}</div><br><button class="btn" onclick="S.done[T]=1;save();R()">${S.done[T]?'Workout complete ✓':'Finish workout'}</button> <span class="mut">${wdone()}/5 this week</span></div>`}
function prog(){const w=S.w,a=w.slice(-14),rate=a.length>1?(a[a.length-1].w-a[0].w)/(a.length-1)*7:0,left=S.set.goal-cw(),wks=rate>0.02?Math.ceil(left/rate):null;return `<div class="page"><h2>Weight progress</h2><div class="grid"><div class="c" style="min-height:0"><h3>${cw().toFixed(1)} kg</h3><div class="mut">7-day average ${avg7().toFixed(1)} kg · gained ${(cw()-S.set.start).toFixed(1)} kg</div><div class="row"><input id="lw" type="number" step=".1" placeholder="Morning weight"><button class="btn" onclick="logW('lw')">Log</button></div></div><div class="c" style="min-height:0"><h3>Trend</h3><div style="font-size:30px" class="lim">${rate>=0?'+':''}${rate.toFixed(2)} kg/wk</div><div class="mut">${wks?`At this pace ~${wks} weeks to ${S.set.goal} kg (rough estimate).`:'Not enough upward trend to project yet.'} Target 0.15–0.30 kg/wk.</div></div></div><div class="c" style="margin:16px 0;min-height:0">${line(w.map(x=>x.w),600,160,'#B8F500')}</div><div class="grid">${[S.set.goal,70,75,80,85].map(m=>`<div class="c" style="min-height:0;padding:16px"><b>${m} kg</b>${bar(cw()-S.set.start,m-S.set.start)}</div>`).join('')}</div></div>`}
function rec(){const r=S.rec[T]||{};const f=(id,l,v,ph)=>`<div><div class="mut">${l}</div><input id="${id}" type="number" value="${v??''}" placeholder="${ph}"></div>`;return `<div class="page"><h2>Recovery & digestion</h2><div class="grid">${f('rs','Sleep (hours)',r.s,'8–10')}${f('rwt','Water (glasses)',r.wt,'')}${f('re','Energy 1–10',r.e,'')}${f('rso','Soreness 1–10',r.so,'')}${f('rf','Fullness 1–10',r.f,'')}${f('rb','Bloating 0–10',r.b,'')}${f('rg','Gas 0–10',r.g,'')}</div><br><button class="btn" onclick="saveR()">Save today</button><div class="mut" style="margin-top:14px">Tracking only. This isn’t medical advice. Talk to a professional if something worries you.</div>${Object.keys(S.rec).length>1?`<div class="c" style="margin-top:20px;min-height:0"><h3>Sleep trend</h3>${line(Object.values(S.rec).map(x=>+x.s||0),400,80,'#B8F500')}</div>`:''}</div>`}
function sett(){const s=S.set;return `<div class="page"><h2>Settings</h2><div class="grid">${[['cal','Calorie target'],['pro','Protein target (g)'],['start','Starting weight (kg)'],['goal','Goal weight (kg)']].map(x=>`<div><div class="mut">${x[1]}</div><input id="s_${x[0]}" type="number" value="${s[x[0]]}"></div>`).join('')}</div><br><button class="btn" onclick="saveS()">Save</button> <button class="btn o" onclick="if(confirm('Clear all data?')){S={demo:0,set:S.set,log:[],w:[{d:T,w:S.set.start}],done:{},sets:{},rec:{},saved:[]};save();go('dash')}">Clear demo data</button><h3>Export / import</h3><textarea id="ex" style="width:100%;height:120px;background:#292E2B;color:#fff;border:1px solid var(--bd);border-radius:14px;padding:10px">${esc(JSON.stringify(S))}</textarea><br><br><button class="btn" onclick="try{S=JSON.parse($('#ex').value);save();go('dash')}catch(e){alert('Invalid data')}">Import</button><div class="mut" style="margin-top:12px">Targets are estimates, not medical advice.</div></div>`}
function rep(){const days=[...Array(7)].map((_,i)=>dk(6-i)),L=d=>S.log.filter(x=>x.d==d),kc=days.map(d=>L(d).reduce((a,x)=>a+x.k,0)),pr=days.map(d=>L(d).reduce((a,x)=>a+x.p,0)),n=kc.filter(x=>x).length||1,sl=days.map(d=>+(S.rec[d]||{}).s).filter(x=>x),a7=S.w.slice(-7),ch=a7.length>1?a7[a7.length-1].w-a7[0].w:0,st=[['Avg calories',Math.round(kc.reduce((a,b)=>a+b,0)/n)+' kcal'],['Avg protein',Math.round(pr.reduce((a,b)=>a+b,0)/n)+' g'],['Avg weight',avg7().toFixed(1)+' kg'],['Weekly change',(ch>=0?'+':'')+ch.toFixed(2)+' kg'],['Workouts',wdone()+' / 5'],['Avg sleep',sl.length?(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(1)+' h':'–']];return `<div class="page"><h2>Weekly report</h2><div class="grid">${st.map(s=>`<div class="stat"><span class="lab">${s[0].toUpperCase()}</span><b>${s[1]}</b></div>`).join('')}</div><div class="c" style="margin-top:18px;min-height:0"><h3>Daily calories vs target</h3><div style="display:flex;gap:10px">${kc.map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:130px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.min(100,v/S.set.cal*100)}%;background:var(--lime);border-radius:10px 10px 4px 4px;opacity:${v?1:.15}"></div></div><div class="mut">${days[i].slice(8)}</div></div>`).join('')}</div></div><div class="mut" style="margin-top:12px">Averages use days you logged food. Estimates only.</div></div>`}
function R(){$('#app').innerHTML=(V=='dash'?'':'<div class="pg">'+nav()+'</div>')+({dash,nutrition:nut,workouts:wk,progress:prog,recovery:rec,report:rep,settings:sett}[V]||dash)()+'<div class="tab">'+[['dash','Home'],['nutrition','Food'],['workouts','Train'],['progress','Weight'],['recovery','Rest'],['report','Report']].map(t=>`<a href="#${t[0]}" class="${V==t[0]?'on':''}">${t[1]}</a>`).join('')+'</div>'}
const go=v=>{location.hash=v};addEventListener('hashchange',()=>{V=location.hash.slice(1)||'dash';R();scrollTo(0,0)});
function logW(id){const v=parseFloat($('#'+id).value);if(!v||v<30||v>200)return;const e=S.w.find(x=>x.d==T);e?e.w=v:S.w.push({d:T,w:v});save();R()}
function logM(i){const m=M.concat(S.saved)[i],x=+$('#sv'+i).value;S.log.push({d:T,n:m.n,k:Math.round(m.k*x),p:Math.round(m.p*x),c:Math.round(m.c*x),f:Math.round(m.f*x)});save();R()}
function addF(){const o={n:$('#fn').value||'Food',k:+$('#fk').value||0,p:+$('#fp').value||0,c:+$('#fc').value||0,f:+$('#ff').value||0};S.log.push({d:T,...o});if($('#fs').checked)S.saved.push(o);save();R()}
function del(i){S.log.splice(i,1);save();R()}
function st(e,j){const o=S.sets[T][e]=S.sets[T][e]||{s:[0,0,0],w:''};o.s[j]=o.s[j]?0:1;save();R()}
function sw(e,v){const o=S.sets[T][e]=S.sets[T][e]||{s:[0,0,0],w:''};o.w=v;save()}
function saveR(){const g=i=>$('#'+i).value;S.rec[T]={s:g('rs'),wt:g('rwt'),e:g('re'),so:g('rso'),f:g('rf'),b:g('rb'),g:g('rg')};save();R()}
function saveS(){['cal','pro','start','goal'].forEach(k=>S.set[k]=+$('#s_'+k).value||S.set[k]);save();go('dash')}
R();
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})</script></body></html>
